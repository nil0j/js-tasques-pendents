<body>
    <header>
        <h1>Liga de Filósofos</h1>
    </header>

    <aside class="sidebar">
        <h2>Opciones</h2>
        <button type="submit" class="save-btn">Guardar tarjetas</button>
        <button type="submit" class="load-btn">Cargar tarjetas</button>
        <div class="sort-options">
          <h3>Ordenar por:</h3>
          <button class="sort-btn">A->Z</button>
          <button class="sort-btn">Z->A</button>
        </div>
        
        <!-- Formulario para crear una nueva tarjeta -->
        <div class="create-card-form">
          <h3>Crear Nueva Tarjeta</h3>
          <form>
            <label for="name">Nombre</label>
            <input type="text" id="name" class="name" required>

            <label for="name">Imagen (URL)</label>
            <input type="text" id="picture" class="picture" required>
      
            <label for="country">País</label>
            <input type="text" id="country" class="country" required>

            <label for="country">Bandera (URL)</label>
            <input type="text" id="flag" class="flag" required>
      
            <label for="philosophy">Corriente Filosófica</label>
            <input type="text" id="current" class="current" required>
      
            <label for="weapon">Arma Principal</label>
            <input type="text" id="weapon" class="weapon" required>
      
            <label for="skills">Sabiduría (0-5)</label>
            <input type="number" id="wisdom" class="wisdom" min="1" max="5" required>

            <label for="skills">Oratoria (0-5)</label>
            <input type="number" id="oratory" class="oratory" min="1" max="5" required>

            <label for="skills">Lógica (0-5)</label>
            <input type="number" id="logic" class="logic" min="1" max="5" required>

            <label for="skills">Innovación (0-5)</label>
            <input type="number" id="innovation" class="innovation" min="1" max="5" required>
      
            <button class="create-btn">Crear Tarjeta</button>
          </form>
        </div>
      </aside>
